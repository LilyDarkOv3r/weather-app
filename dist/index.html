<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <div id="background">

        <input type="text" id="citysearch" placeholder="Város neve" autocomplete="off">

          <p class="card-label" >Páratartalom <span id="humidity"></span>
          </p>
        </div>
        
        <div class="small-card">
           <p class="card-label">Szélsebesség <span id="wind-speed"></span>
          </p>
        </div>

      </div>

    </div>
